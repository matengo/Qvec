name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [published]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'release'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Build README samples
        run: dotnet build samples/Qvec.Samples.Readme/Qvec.Samples.Readme.csproj --no-restore --configuration Release

      - name: Verify test projects exist
        shell: bash
        run: |
          if ! find . -name '*.csproj' -print0 | xargs -0 grep -l 'Microsoft.NET.Test.Sdk' | grep -q .; then
            echo "No test projects found — see plan phase 1"
            exit 1
          fi

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=KnownDefect&Category!=Slow"

      - name: Run slow quality tests
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category=Slow"

      - name: Publish Qvec.Console with Native AOT
        run: dotnet publish Qvec.Console/Qvec.Console.csproj --configuration Release -r linux-x64 /p:PublishAot=true --self-contained true

      - name: Publish Qvec.Api with Native AOT
        run: dotnet publish Qvec.Api/Qvec.Api.csproj --configuration Release -r linux-x64 /p:PublishAot=true --self-contained true

  publish:
    name: Publish NuGet Packages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: read
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Qvec.Core
        run: |
          dotnet pack Qvec.Core/Qvec.Core.csproj \
            --no-build --configuration Release --output ./packages \
            /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack Qvec.Core.Client
        run: |
          dotnet pack Qvec.Core.Client/Qvec.Core.Client.csproj \
            --no-build --configuration Release --output ./packages \
            /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        run: |
          dotnet nuget push ./packages/*.nupkg \
            --api-key ${{ env.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
